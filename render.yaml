services:
  - type: web
    name: scoresense-vlu-api
    runtime: python
    plan: free
    rootDir: backend_scoresense
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ALLOWED_ORIGINS
        value: https://scoresense-vlu.web.app,https://scoresense-vlu.firebaseapp.com
